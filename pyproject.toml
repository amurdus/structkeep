[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amurdus-structkeep"
version = "0.1.0"
description = "比对分块前后的结构元素数量，标出被破坏的表格与被截断的列表"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "amurdus" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://amurdus.github.io"
Repository = "https://github.com/amurdus/structkeep"
Issues = "https://github.com/amurdus/structkeep/issues"

[project.scripts]
structkeep = "structkeep:main"

[tool.setuptools]
py-modules = ["structkeep"]
